# Deploy Balance to GitHub Pages.
#
# Site multi-pages :
#   - `/`               → l'application (dist/balance.html renommé index.html)
#   - `/presentation/`  → la vitrine web/presentation.html qui embarque
#                          l'application en iframe (../?demo=apero). Les
#                          polices @fontsource sont copiées à côté pour
#                          respecter la promesse offline-first (pas de
#                          Google Fonts).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build single-file
        working-directory: app
        run: npm run build

      - name: Duplicate balance.html → index.html
        run: cp dist/balance.html dist/index.html

      - name: Copy vitrine → dist/presentation/index.html
        run: |
          mkdir -p dist/presentation/fonts
          cp web/presentation.html dist/presentation/index.html

      - name: Copy @fontsource WOFF2 to vitrine
        run: |
          cp app/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2 dist/presentation/fonts/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
