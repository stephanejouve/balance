# Deploy Balance to GitHub Pages.
#
# Site multi-pages :
#   - `/`               → l'application (dist/balance.html renommé index.html)
#   - `/presentation/`  → la vitrine web/presentation.html qui embarque
#                          l'application en iframe (../?demo=apero). Les
#                          polices @fontsource sont copiées à côté pour
#                          respecter la promesse offline-first (pas de
#                          Google Fonts).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Diagnostic — état de l'arbre avant build (issue #113)
        # Le SHA build inclut un suffixe `-dirty` quand `git status --porcelain`
        # (côté vite.config.ts) trouve des fichiers modifiés. Le suffixe est
        # présent en permanence en prod (ex. `8e9c577-dirty` post-merge #112)
        # alors que le checkout part propre. Ce pas de diagnostic imprime ce
        # que le workflow a modifié entre le checkout et le calcul SHA — pour
        # savoir ce qu'il faut corriger. CD msg 6715 (2026-09-13).
        # Ajouté aussi dans ci.yml pour parité, mais ci.yml sort clean donc
        # la salissure est spécifique à pages.yml.
        run: |
          echo "=== git status --porcelain (à la racine du dépôt) ==="
          git status --porcelain || true
          echo ""
          echo "=== git diff --stat (fichiers modifiés vs HEAD) ==="
          git diff --stat || true
          echo ""
          echo "=== fichiers non-suivis ==="
          git ls-files --others --exclude-standard || true

      - name: Build single-file
        working-directory: app
        run: npm run build

      - name: Duplicate balance.html → index.html
        run: cp dist/balance.html dist/index.html

      - name: Injecter APP_VERSION dans sw.js
        # public/sw.js contient la constante littérale `__APP_VERSION__` —
        # vite ne process pas les assets static via `define`. On sed après
        # le build pour la remplacer par la vraie version extraite du bundle.
        run: |
          APP_VERSION=$(grep -oE "['\"]([0-9]{8}\.[0-9]{4})['\"]" dist/balance.html | head -1 | tr -d "'\"")
          sed -i "s/__APP_VERSION__/$APP_VERSION/g" dist/sw.js
          grep SW_VERSION dist/sw.js

      - name: Générer version.json (manifest de mise à jour)
        # La version bundlée est injectée dans balance.html au build vite
        # via __APP_VERSION__. On l'extrait pour publier un manifest lisible
        # par le composant MiseAJourBandeau (fetch + comparaison).
        run: |
          APP_VERSION=$(grep -oE "['\"]([0-9]{8}\.[0-9]{4})['\"]" dist/balance.html | head -1 | tr -d "'\"")
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Impossible d'extraire APP_VERSION de balance.html"
            exit 1
          fi
          cat > dist/version.json <<EOF
          {
            "version": "$APP_VERSION",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "download_url": "https://stephanejouve.github.io/balance/balance.html"
          }
          EOF
          echo "version.json publié : $(cat dist/version.json)"

      - name: Copy vitrine → dist/presentation/index.html
        run: |
          mkdir -p dist/presentation/fonts
          cp web/presentation.html dist/presentation/index.html

      - name: Copy @fontsource WOFF2 to vitrine
        run: |
          cp app/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2 dist/presentation/fonts/
          cp app/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2 dist/presentation/fonts/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
