[project]
name = "balance-pdf-import"
version = "0.2.0"
description = "Convertit les planning PDF de l'organisateur Musiques Festives en xlsx d'import Balance."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
balance-pdf-import = "balance_pdf_import.cli:main"

[project.gui-scripts]
balance-pdf-import-gui = "balance_pdf_import.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
