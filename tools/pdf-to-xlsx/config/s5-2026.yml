# Config session Musiques Festives S5 2026 (23-28 août).

session: "Musiques Festives S5 2026"

# Mapping jour → date (utilisé quand le PDF ne porte pas la date en toutes
# lettres, ex. la table de répartition Apéro concert : "Lun 24" → 2026-08-24).
dates:
  dimanche: 2026-08-23
  lundi: 2026-08-24
  mardi: 2026-08-25
  mercredi: 2026-08-26
  jeudi: 2026-08-27
  vendredi: 2026-08-28

# Salles attendues en en-tête de colonnes. L'ordre n'a pas d'importance —
# le parseur détecte la position x par lecture du PDF.
salles:
  - "L'Étang"
  - "Le Garage"
  - "XVème"
  - "Les Clapiers"
  - "L'Espérance"
  - "La Chênaie"

# Mots-clés qui marquent une séance à extraire (colonne "Proposés" du xlsx).
mots_cles_seance:
  - "Répétition"
  - "Pré-Production"
  - "Post-Production"
  - "Enregistrement"

# Contenus reconnus mais volontairement ignorés (ne produisent pas de séance).
ignorer:
  - "Préparations"
  - "Combo"
  - "Jams"
  - "En acoustique"
  - "Salle Disponible"
  - "Salle non-disponible"
  - "Promenade"
  # "Répétition Intervenants" = répétition privée des encadrants du stage,
  # pas un morceau du répertoire — sortie du PDF lundi à 16:30-20:45.
  - "Intervenants"

# Regex extraction responsable dans "<Mot-clé> <Titre> avec <Nom>".
motif_responsable: 'avec (?P<nom>.+?)(?:\s|$)'
